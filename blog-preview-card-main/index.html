<!DOCTYPE html>
<html>
<head>
    <title>Learning Card Design</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="card">

        <div class="image-box">
            <img src="assets/images/illustration-article.svg" alt="HTML CSS">
        </div>

        <div class="content">

            <span class="tag">Learning</span>

            <p class="date">Published 21 Dec 2023</p>

            <h2>HTML & CSS foundations</h2>

            <p class="description">
                These languages are the backbone of every website,
                defining structure, content, and presentation.
            </p>


            <div class="author">

                <img src="assets/images/image-avatar.webp">

                <span>
                    Greg Hooper
                </span>

            </div>

        </div>

    </div>

</div>


</body>
</html>
